name: Guardrails template checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-template:
    name: verify-template (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Check out code (review pinned SHA before upgrades)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Verify template
        id: verify
        run: python scripts/verify.py --mode full
      # Only these starter-kit tests use synthetic data. Keep arbitrary app
      # command output hidden by the reusable verifier unless explicitly reviewed.
      - name: Diagnose starter unit tests if verification fails
        if: ${{ failure() && steps.verify.outcome == 'failure' }}
        run: python -m unittest discover -s tests -v
